name: Audit

# scheduled workflow は default branch (main) 上の定義で動作するため、本 workflow は main 反映後に有効化される
on:
  schedule:
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high
